name: Cache 📝

on:
  push:
    branches:
      - main
    paths:
      - "**/*.nix"
      - "**/*.age"
      - "flake.lock"

concurrency:
  group: ci-${{ github.ref }}-cache
  cancel-in-progress: true

jobs:
  cache:
    name: Cache 📝
    strategy:
      matrix:
        include:
          - image: ubuntu-latest
            derivation: null
            buildDevShell: true
          - image: ubuntu-24.04-arm
            derivation: ".#nixosConfigurations.bpi.config.system.build.toplevel"
            buildDevShell: true
          - image: ubuntu-24.04-arm
            derivation: ".#nixosConfigurations.pi.config.system.build.toplevel"
            buildDevShell: false
          - image: macos-latest
            derivation: null
            buildDevShell: true
    runs-on: ${{ matrix.image }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: dlubawy
          extraPullNames: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build derivation
        if: ${{ matrix.derivation != null }}
        run: nix build ${{ matrix.derivation }}
      - name: Build development shell
        if: ${{ matrix.buildDevShell }}
        run: nix develop . -c true
